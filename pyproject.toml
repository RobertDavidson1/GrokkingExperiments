[project]
name = "grokkingexperiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rob Davidson", email = "your-email@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
    "scienceplots>=2.2.2",
    "sympy>=1.14.0",
    "torch>=2.15.0",
    "typer>=0.27.3",
]

[project.scripts]
grok = "grokkingexperiments.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
