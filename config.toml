[model]
actv_func = "relu"          # "relu", "tanh", "sigmoid"
embed_dim = 128
hidden_dim = 256

[train]
epochs = 250_000             # max epochs used trainign the model

[group]
name = "Zn"
n = 113
split = 0.4

[settings]
seed = 1337                 # random seed
print_progress = true       # whether to print progress every couple epochs
progress_interval = 100     # Print progress every epochs

model_dir = "data/models/"
model_filename = "custom_model.pt"
